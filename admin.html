<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Andi Electronics | Admin Orders</title>
<link rel="stylesheet" href="style.css?v=9">
<style>
body{background:#f4f7fb}.admin-wrap{max-width:1180px;margin:auto;padding:32px 20px 60px}
.admin-card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.admin-login{max-width:460px;margin:70px auto}.admin-form{display:grid;gap:14px}.admin-form label{display:grid;gap:7px;font-weight:700}
.admin-form input,.admin-form select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8dee8;border-radius:10px;font:inherit}
.admin-message{margin-top:14px;padding:12px;border-radius:10px;display:none}.admin-message.show{display:block}.admin-message.error{background:#fee2e2;color:#991b1b}.admin-message.success{background:#dcfce7;color:#166534}.admin-message.info{background:#e0f2fe;color:#075985}
.admin-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.admin-actions{display:flex;gap:10px}
.order-list{display:grid;gap:14px}.order-card{border:1px solid #e2e8f0;border-radius:16px;padding:18px}
.order-head{display:flex;justify-content:space-between;gap:15px}.order-number{font-weight:800}.order-meta{color:#64748b;font-size:.9rem;margin-top:4px}
.order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.order-grid div{background:#f8fafc;padding:11px;border-radius:10px}.order-grid small{display:block;color:#64748b;margin-bottom:4px}
.status-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status-row select{min-width:220px}.empty{text-align:center;color:#64748b;padding:30px}
@media(max-width:720px){.admin-top{align-items:flex-start;flex-direction:column}.order-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView" class="admin-wrap">
 <div class="admin-card admin-login">
  <p class="eyebrow">ANDI ELECTRONICS</p><h1>Admin orders</h1>
  <p>Private order management. Customers do not use this page.</p>
  <div class="admin-form">
   <label>Email address<input id="adminEmail" type="email" value="andisalebese839@gmail.com" autocomplete="username"></label>
   <label>Password<input id="adminPassword" type="password" autocomplete="current-password" placeholder="Enter your password"></label>
   <button class="btn primary" id="loginBtn" type="button">Sign in</button>
  </div>
  <div id="loginMessage" class="admin-message"></div>
 </div>
</div>

<div id="dashboardView" class="admin-wrap" hidden>
 <div class="admin-top">
  <div><p class="eyebrow">ANDI ELECTRONICS</p><h1>Order dashboard</h1><p>Manage customer orders here.</p></div>
  <div class="admin-actions"><button class="btn ghost" id="refreshBtn" type="button">Refresh</button><button class="btn primary" id="logoutBtn" type="button">Log out</button></div>
 </div>
 <div class="admin-card">
  <p class="eyebrow">CUSTOMER ORDERS</p><h2>Orders <span id="orderCount"></span></h2>
  <div id="adminMessage" class="admin-message"></div>
  <div id="ordersList" class="order-list"><div class="empty">Loading...</div></div>
 </div>
</div>

<script>
(function(){
"use strict";
var URL="https://qheysduwchwjfxquglxu.supabase.co";
var KEY="sb_publishable_folUp2DzQKjcMdhrobmhEQ_PWAE9wkn";
var statuses=["Order received","Order accepted","Preparing order","Shipped","Out for delivery","Order delivered"];
var token=sessionStorage.getItem("andiAdminAccessToken")||"";
function $(id){return document.getElementById(id)}
function show(el,text,type){el.textContent=text;el.className="admin-message show "+type}
function headers(){return {"apikey":KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json"}}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]})}
function money(v){return "R"+Number(v||0).toFixed(2)}
function loginView(){ $("loginView").hidden=false; $("dashboardView").hidden=true }
function dashboardView(){ $("loginView").hidden=true; $("dashboardView").hidden=false; loadOrders() }

async function login(){
 var btn=$("loginBtn"),msg=$("loginMessage"),email=$("adminEmail").value.trim(),password=$("adminPassword").value;
 if(!email||!password){show(msg,"Please enter your email and password.","error");return}
 btn.disabled=true;btn.textContent="Signing in...";
 show(msg,"Connecting to your secure admin account...","info");
 try{
  var response=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:email,password:password})});
  var data=await response.json().catch(function(){return {}}); 
  if(!response.ok) throw new Error(data.error_description||data.msg||data.message||("Supabase sign-in failed ("+response.status+")"));
  if(!data.access_token) throw new Error("Supabase did not return a login session.");
  token=data.access_token;sessionStorage.setItem("andiAdminAccessToken",token);
  show(msg,"Signed in. Loading orders...","success");
  dashboardView();
 }catch(err){show(msg,err.message||"Sign-in failed.","error")}
 finally{btn.disabled=false;btn.textContent="Sign in"}
}

async function loadOrders(){
 var list=$("ordersList");list.innerHTML='<div class="empty">Loading orders...</div>';
 try{
  var response=await fetch(URL+"/rest/v1/orders?select=*&order=created_at.desc",{headers:headers()});
  var data=await response.json().catch(function(){return []});
  if(!response.ok) throw new Error(data.message||data.hint||data.details||("Could not load orders ("+response.status+")"));
  $("orderCount").textContent="("+data.length+")";
  if(!data.length){list.innerHTML='<div class="empty">No orders yet.</div>';return}
  list.innerHTML=data.map(card).join("");
 }catch(err){
  list.innerHTML='<div class="empty">'+esc(err.message)+'</div>';
  show($("adminMessage"),err.message,"error");
  if(/401|403|JWT|token|permission/i.test(err.message)){token="";sessionStorage.removeItem("andiAdminAccessToken");loginView()}
 }
}

function card(o){
 var items=[];
 try{items=Array.isArray(o.products)?o.products:JSON.parse(o.products||"[]")}catch(e){}
 var itemText=items.map(function(x){return "<li>"+esc(x.name)+" × "+esc(x.qty)+"</li>"}).join("");
 var current=o.status==="Delivered"?"Order delivered":o.status;
 var opts=statuses.map(function(s){return '<option value="'+esc(s)+'"'+(s===current?" selected":"")+'>'+esc(s)+"</option>"}).join("");
 return '<article class="order-card">'+
 '<div class="order-head"><div><div class="order-number">'+esc(o.order_number)+'</div><div class="order-meta">'+esc(new Date(o.created_at).toLocaleString())+'</div></div><strong>'+money(o.order_total)+'</strong></div>'+
 '<div class="order-grid"><div><small>Customer</small>'+esc(o.customer_name)+'</div><div><small>Email</small>'+esc(o.customer_email)+'</div><div><small>Phone</small>'+esc(o.customer_phone)+'</div><div><small>Fulfilment</small>'+esc(o.fulfilment)+'</div><div><small>Area</small>'+esc(o.delivery_area||"Collection")+'</div><div><small>Address</small>'+esc(o.delivery_address||"—")+'</div></div>'+
 '<strong>Products</strong><ul>'+(itemText||"<li>No product details</li>")+'</ul>'+
 '<div class="status-row"><select>'+opts+'</select><button class="btn primary save-status" type="button" data-id="'+esc(o.id)+'" data-number="'+esc(o.order_number)+'">Save status</button></div>'+
 '</article>';
}

async function saveStatus(btn){
 var select=btn.previousElementSibling,id=btn.getAttribute("data-id"),number=btn.getAttribute("data-number"),newStatus=select.value;
 btn.disabled=true;btn.textContent="Saving...";
 try{
  var response=await fetch(URL+"/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign({},headers(),{"Prefer":"return=representation"}),body:JSON.stringify({status:newStatus,updated_at:new Date().toISOString()})});
  var data=await response.json().catch(function(){return []});
  if(!response.ok)throw new Error(data.message||data.hint||data.details||("Could not update order ("+response.status+")"));
  if(!Array.isArray(data)||!data.length)throw new Error("No order was updated.");
  show($("adminMessage"),number+" updated to "+newStatus+".","success");loadOrders();
 }catch(err){show($("adminMessage"),"Could not update "+number+": "+err.message,"error")}
 finally{btn.disabled=false;btn.textContent="Save status"}
}

document.addEventListener("DOMContentLoaded",function(){
 $("loginBtn").addEventListener("click",login);
 $("adminPassword").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
 $("refreshBtn").addEventListener("click",loadOrders);
 $("logoutBtn").addEventListener("click",function(){token="";sessionStorage.removeItem("andiAdminAccessToken");loginView()});
 $("ordersList").addEventListener("click",function(e){var btn=e.target.closest(".save-status");if(btn)saveStatus(btn)});
 if(token)dashboardView();else loginView();
});
})();
</script>
</body>
</html>
