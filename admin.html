<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andi Electronics | Admin Orders</title>
<link rel="stylesheet" href="style.css?v=8">
<style>
body{background:#f4f7fb}.admin-wrap{max-width:1180px;margin:0 auto;padding:32px 20px 60px}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
.admin-top h1{margin:0}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}
.admin-card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.08);margin-bottom:20px}
.admin-login{max-width:460px;margin:80px auto}
.admin-form{display:grid;gap:14px}.admin-form label{display:grid;gap:7px;font-weight:700}
.admin-form input,.admin-form select{width:100%;padding:13px 14px;border:1px solid #d8dee8;border-radius:10px;font:inherit}
.admin-message{margin-top:12px;padding:12px;border-radius:10px;display:none}.admin-message.show{display:block}.admin-message.error{background:#fee2e2;color:#991b1b}.admin-message.success{background:#dcfce7;color:#166534}
.order-list{display:grid;gap:14px}.order-card{border:1px solid #e2e8f0;border-radius:16px;padding:18px;background:#fff}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap}
.order-number{font-weight:800;font-size:1.05rem}.order-meta{color:#64748b;font-size:.9rem;margin-top:4px}
.order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.order-grid div{background:#f8fafc;padding:11px;border-radius:10px}.order-grid small{display:block;color:#64748b;margin-bottom:4px}
.order-items{margin:12px 0;padding-left:18px}.status-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status-row select{min-width:210px}
.status-row button{min-width:120px}.empty-admin{text-align:center;color:#64748b;padding:35px}
@media(max-width:720px){.order-grid{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginView" class="admin-wrap">
  <div class="admin-card admin-login">
    <p class="eyebrow">ANDI ELECTRONICS</p>
    <h1>Admin orders</h1>
    <p>Sign in to manage customer orders and update their delivery status.</p>
    <form id="loginForm" class="admin-form">
      <label>Email address<input id="adminEmail" type="email" value="andisalebese839@gmail.com" required autocomplete="username"></label>
      <label>Password<input id="adminPassword" type="password" required autocomplete="current-password" placeholder="Your Supabase admin password"></label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <div id="loginMessage" class="admin-message"></div>
  </div>
</div>

<div id="dashboardView" class="admin-wrap" hidden>
  <div class="admin-top">
    <div><p class="eyebrow">ANDI ELECTRONICS</p><h1>Order dashboard</h1><p>Manage customer orders without opening Supabase.</p></div>
    <div class="admin-actions"><button class="btn ghost" id="refreshBtn" type="button">Refresh orders</button><button class="btn primary" id="logoutBtn" type="button">Log out</button></div>
  </div>
  <div class="admin-card">
    <div class="section-head"><div><p class="eyebrow">CUSTOMER ORDERS</p><h2>Orders</h2></div><span id="orderCount"></span></div>
    <div id="adminMessage" class="admin-message"></div>
    <div id="ordersList" class="order-list"><div class="empty-admin">Loading orders...</div></div>
  </div>
</div>
<script>
const SUPABASE_URL="https://qheysduwchwjfxquglxu.supabase.co";
const SUPABASE_KEY="sb_publishable_folUp2DzQKjcMdhrobmhEQ_PWAE9wkn";
const STATUSES=["Order received","Order accepted","Preparing order","Shipped","Out for delivery","Order delivered"];
let accessToken=sessionStorage.getItem("andiAdminAccessToken")||"";

const $=s=>document.querySelector(s);
function authHeaders(){return {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+accessToken,"Content-Type":"application/json","Accept":"application/json"}}
function message(el,text,type){el.textContent=text;el.className="admin-message show "+type}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]||c))}
function money(v){return "R"+Number(v||0).toFixed(2)}
function showDashboard(){ $("#loginView").hidden=true; $("#dashboardView").hidden=false; loadOrders() }
function showLogin(){ $("#loginView").hidden=false; $("#dashboardView").hidden=true }

async function login(e){
  e.preventDefault();
  const msg=$("#loginMessage");msg.className="admin-message";
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email:$("#adminEmail").value.trim(),password:$("#adminPassword").value})
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.error_description||data.msg||"Sign-in failed");
    accessToken=data.access_token;sessionStorage.setItem("andiAdminAccessToken",accessToken);
    showDashboard();
  }catch(err){message(msg,err.message,"error")}
}

async function loadOrders(){
  const list=$("#ordersList");
  list.innerHTML='<div class="empty-admin">Loading orders...</div>';
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/orders?select=*&order=created_at.desc",{headers:authHeaders()});
    const data=await r.json();
    if(!r.ok)throw new Error(data.message||data.hint||"Could not load orders");
    $("#orderCount").textContent=data.length+" order"+(data.length===1?"":"s");
    if(!data.length){list.innerHTML='<div class="empty-admin">No orders yet.</div>';return}
    list.innerHTML=data.map(orderCard).join("");
  }catch(err){
    list.innerHTML='<div class="empty-admin">'+esc(err.message)+'</div>';
    if(/JWT|token|permission|403|401/i.test(err.message)){accessToken="";sessionStorage.removeItem("andiAdminAccessToken");showLogin()}
  }
}

function orderCard(o){
  let items=[];
  try{items=Array.isArray(o.products)?o.products:JSON.parse(o.products||"[]")}catch{}
  const itemHtml=items.map(x=>"<li>"+esc(x.name)+" × "+esc(x.qty)+" — "+money(Number(x.price)*Number(x.qty))+"</li>").join("");
  const current=o.status==="Delivered"?"Order delivered":o.status;
  const options=STATUSES.map(s=>'<option value="'+esc(s)+'" '+(s===current?"selected":"")+'>'+esc(s)+"</option>").join("");
  return '<article class="order-card">'+
    '<div class="order-head"><div><div class="order-number">'+esc(o.order_number)+'</div><div class="order-meta">'+esc(new Date(o.created_at).toLocaleString())+'</div></div><strong>'+money(o.order_total)+'</strong></div>'+
    '<div class="order-grid">'+
      '<div><small>Customer</small>'+esc(o.customer_name)+'</div>'+
      '<div><small>Email</small>'+esc(o.customer_email)+'</div>'+
      '<div><small>Phone</small>'+esc(o.customer_phone)+'</div>'+
      '<div><small>Fulfilment</small>'+esc(o.fulfilment)+'</div>'+
      '<div><small>Area</small>'+esc(o.delivery_area||"Collection")+'</div>'+
      '<div><small>Address</small>'+esc(o.delivery_address||"—")+'</div>'+
    '</div>'+
    '<strong>Products</strong><ul class="order-items">'+(itemHtml||"<li>No product details</li>")+'</ul>'+
    '<div class="status-row"><select data-status-id="'+esc(o.id)+'">'+options+'</select><button class="btn primary status-save" type="button" data-order-id="'+esc(o.id)+'" data-order-number="'+esc(o.order_number)+'">Save status</button></div>'+
    '</article>';
}

async function saveStatus(id,orderNumber,select,btn){
  const newStatus=select.value;
  btn.disabled=true;btn.textContent="Saving...";
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/orders?id=eq."+encodeURIComponent(id),{
      method:"PATCH",headers:{...authHeaders(),"Prefer":"return=representation"},
      body:JSON.stringify({status:newStatus,updated_at:new Date().toISOString()})
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.message||data.hint||data.details||"Could not update order");
    if(!Array.isArray(data)||!data.length)throw new Error("The order was not updated. Check admin permissions.");
    message($("#adminMessage"),orderNumber+" updated to "+newStatus+".","success");
    await loadOrders();
  }catch(err){message($("#adminMessage"),"Could not update "+orderNumber+": "+err.message,"error")}
  finally{btn.disabled=false;btn.textContent="Save status"}
}

$("#ordersList").addEventListener("click",e=>{
  const btn=e.target.closest(".status-save");
  if(!btn)return;
  const select=btn.previousElementSibling;
  saveStatus(btn.dataset.orderId,btn.dataset.orderNumber,select,btn);
});
$("#loginForm").addEventListener("submit",login);
$("#refreshBtn").onclick=loadOrders;
$("#logoutBtn").onclick=()=>{accessToken="";sessionStorage.removeItem("andiAdminAccessToken");showLogin()};
if(accessToken)showDashboard();else showLogin();
</script>
</body>
</html>
